<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iPhone 群控 MVP</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f5f5f7; color: #1d1d1f; }
    main { max-width: 900px; margin: 48px auto; padding: 0 20px; }
    h1 { margin-bottom: 8px; }
    .hint { color: #6e6e73; margin: 0 0 28px; }
    #devices { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .device { background: white; border: 1px solid #ddd; border-radius: 14px; padding: 20px; box-shadow: 0 4px 16px #0000000a; }
    .device h2 { margin: 0 0 14px; font-size: 20px; }
    .meta { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; overflow-wrap: anywhere; }
    .online { color: #147d2c; font-weight: 600; }
    .actions { display: flex; gap: 10px; margin-top: 18px; }
    button { border: 0; border-radius: 9px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
    button.primary { background: #0071e3; color: white; }
    button.secondary { background: #e8e8ed; color: #1d1d1f; }
    button:disabled { opacity: .5; cursor: wait; }
    .result { min-height: 22px; margin-top: 14px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .success { color: #147d2c; }
    .error { color: #b42318; }
    .empty { padding: 30px; background: white; border-radius: 14px; color: #6e6e73; }
  </style>
</head>
<body>
  <main>
    <h1>iPhone 群控 MVP</h1>
    <p class="hint">仅显示通过 USB 连接并已信任这台 Mac 的 iPhone。</p>
    <section id="devices"><div class="empty">正在读取设备…</div></section>
  </main>
  <script>
    const devicesRoot = document.getElementById('devices');
    let activeRequests = 0;

    function makeText(tag, text, className) {
      const node = document.createElement(tag);
      node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    async function runAction(udid, action, result, buttons) {
      activeRequests += 1;
      buttons.forEach(button => button.disabled = true);
      result.className = 'result';
      result.textContent = action === 'test' ? '正在连接 WebDriverAgent…' : '正在启动抖音…';
      try {
        const response = await fetch(`/api/devices/${encodeURIComponent(udid)}/${action === 'test' ? 'test' : 'open-douyin'}`, { method: 'POST' });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || `HTTP ${response.status}`);
        result.className = 'result success';
        result.textContent = payload.message;
      } catch (error) {
        result.className = 'result error';
        result.textContent = `失败：${error.message}`;
      } finally {
        buttons.forEach(button => button.disabled = false);
        activeRequests -= 1;
      }
    }

    function renderDevices(devices) {
      devicesRoot.replaceChildren();
      if (!devices.length) {
        devicesRoot.append(makeText('div', '没有发现已连接的 iPhone。请连接设备、解锁并点击“信任”。', 'empty'));
        return;
      }
      devices.forEach((device, index) => {
        const card = document.createElement('article');
        card.className = 'device';
        card.append(makeText('h2', device.name || `iPhone ${String(index + 1).padStart(2, '0')}`));
        card.append(makeText('div', `UDID: ${device.udid}`, 'meta'));
        card.append(makeText('p', `状态：${device.status}`, 'online'));
        const actions = document.createElement('div');
        actions.className = 'actions';
        const testButton = makeText('button', '测试连接', 'secondary');
        const openButton = makeText('button', '打开抖音', 'primary');
        const result = makeText('div', '', 'result');
        const buttons = [testButton, openButton];
        testButton.addEventListener('click', () => runAction(device.udid, 'test', result, buttons));
        openButton.addEventListener('click', () => runAction(device.udid, 'open', result, buttons));
        actions.append(testButton, openButton);
        card.append(actions, result);
        devicesRoot.append(card);
      });
    }

    async function loadDevices() {
      if (activeRequests > 0) return;
      try {
        const response = await fetch('/api/devices');
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || `HTTP ${response.status}`);
        renderDevices(payload.devices);
      } catch (error) {
        devicesRoot.replaceChildren(makeText('div', `设备读取失败：${error.message}`, 'empty error'));
      }
    }

    loadDevices();
    window.setInterval(loadDevices, 5000);
  </script>
</body>
</html>
